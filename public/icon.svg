<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2375"/>
      <stop offset="0.55" stop-color="#151538"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="230" y1="800" x2="800" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="check" x1="350" y1="630" x2="740" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Badan ikon -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#sheen)"/>
  <rect x="34" y="34" width="956" height="956" rx="222" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Cincin progres 3/4 (celah di kanan atas) -->
  <circle cx="512" cy="512" r="290" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="64"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"
          stroke-dasharray="1366.6 1822.1" filter="url(#soft)" opacity="0.7"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"
          stroke-dasharray="1366.6 1822.1"/>

  <!-- Centang yang keluar melewati celah cincin -->
  <path d="M356 512 L468 624 L752 300" fill="none" stroke="#a5f3fc" stroke-opacity="0.55" stroke-width="80"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <path d="M356 512 L468 624 L752 300" fill="none" stroke="url(#check)" stroke-width="80"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
